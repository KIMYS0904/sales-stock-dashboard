<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>품목정보 및 재고현황 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1f2733;--muted:#6b7688;--line:#e4e8ef;
--brand:#1f5fbf;--brand-d:#164a99;--ok:#1a9c6b;--warn:#e0a010;--bad:#d64545;--chip:#eef2f8;--purple:#7b52c9;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
header h1{font-size:17px;margin:0;font-weight:700;}
.meta{color:var(--muted);font-size:12px;}
.spacer{flex:1;}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--brand-d);}
.btn.ghost{background:var(--chip);color:var(--brand);}
.wrap{padding:18px 20px;max-width:1460px;margin:0 auto;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
.kpi .lbl{color:var(--muted);font-size:12px;margin-bottom:5px;}
.kpi .val{font-size:22px;font-weight:700;}
.kpi .val.bad{color:var(--bad);}.kpi .val.warn{color:var(--warn);}.kpi .val.purple{color:var(--purple);}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
input[type=text],select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
#search{flex:1;min-width:240px;}
.layout{display:grid;grid-template-columns:1fr 400px;gap:15px;align-items:start;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.tblwrap{max-height:70vh;overflow:auto;}
table{width:100%;border-collapse:collapse;}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f8fafc;font-size:11.5px;color:var(--muted);font-weight:600;cursor:pointer;position:sticky;top:0;}
td.num,th.num{text-align:right;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:#f5f9ff;}
tbody tr.sel{background:#e8f1ff;}
.unit{color:var(--muted);font-size:11px;font-weight:600;}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;}
.b-ok{background:#e4f5ee;color:var(--ok);}.b-warn{background:#fdf3dc;color:var(--warn);}
.b-bad{background:#fbe6e6;color:var(--bad);}.b-none{background:#eef1f5;color:#8894a5;}
.b-exp{background:#f0e7fb;color:var(--purple);}.b-mgmt{background:#efe6fb;color:var(--purple);border:1px solid #d9c6f5;}
.detail{position:sticky;top:70px;}
.detail .hd{padding:14px 15px;border-bottom:1px solid var(--line);}
.detail .hd .nm{font-size:15px;font-weight:700;line-height:1.35;}
.detail .hd .sub{color:var(--muted);font-size:12px;margin-top:4px;}
.detail .bd{padding:13px 15px;max-height:66vh;overflow:auto;}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);gap:10px;}
.row .k{color:var(--muted);}.row .v{font-weight:600;text-align:right;}
.sec-title{font-size:11.5px;color:var(--muted);font-weight:700;margin:15px 0 7px;letter-spacing:.4px;}
.cust-table td,.wh-table td{padding:7px 9px;font-size:12.5px;}
.mgmt-box{background:#f7f3fd;border:1px solid #e3d5f7;border-radius:10px;padding:11px;margin-top:4px;}
.mgmt-box .plan{font-size:12.5px;color:#4a3570;line-height:1.5;margin-top:7px;white-space:normal;}
.empty{padding:38px 15px;text-align:center;color:var(--muted);line-height:1.6;}
.price-calc{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;}
.price-calc label{font-size:12px;color:var(--muted);display:block;margin:6px 0 4px;}
.price-calc .out{font-size:18px;font-weight:700;color:var(--brand);margin-top:9px;}
.foot{color:var(--muted);font-size:12px;margin-top:14px;text-align:center;line-height:1.6;}
@media(max-width:1000px){.layout{grid-template-columns:1fr;}.kpis{grid-template-columns:repeat(2,1fr);}.detail{position:static;}}
</style></head><body>
<header>
<h1>📊 품목정보 및 재고현황 대시보드</h1>
<span class="meta" id="updated"></span>
<div class="spacer"></div>
<button class="btn ghost" onclick="document.getElementById('xlIn').click()">📁 창고재고 업로드 (매일 오전)</button>
<input type="file" id="xlIn" accept=".xlsx,.xls" style="display:none" onchange="onXl(event)">
</header>
<div class="wrap">
<div class="kpis">
<div class="kpi"><div class="lbl">총 취급 품목</div><div class="val" id="k-total">-</div></div>
<div class="kpi"><div class="lbl">재고 소진</div><div class="val bad" id="k-short">-</div></div>
<div class="kpi"><div class="lbl">소비기한 임박 (60일↓)</div><div class="val warn" id="k-exp">-</div></div>
<div class="kpi"><div class="lbl">출고관리 품목</div><div class="val purple" id="k-mgmt">-</div></div>
</div>
<div class="toolbar">
<input type="text" id="search" placeholder="🔍 품번 · 품명 · 규격 검색 (상담 중 바로 입력)">
<select id="fCat" onchange="render()"><option value="">전체 분류</option></select>
<select id="fStatus" onchange="render()">
<option value="">전체 재고상태</option><option value="bad">소진</option><option value="ok">재고보유</option>
<option value="exp">소비기한 임박</option><option value="mgmt">출고관리 품목</option>
</select>
</div>
<div class="layout">
<div class="panel"><div class="tblwrap"><table><thead><tr>
<th data-s="code">품번</th><th data-s="name">품명 / 규격</th>
<th data-s="cat">분류</th><th class="num" data-s="stock">현재고</th>
<th class="num" data-s="price">판매단가</th><th class="num" data-s="qty">누적판매</th>
</tr></thead><tbody id="tbody"></tbody></table></div></div>
<div class="panel detail" id="detail"><div class="empty">품목을 선택하면<br>재고 · 창고 · 유통기한 · 거래처별 단가가 표시됩니다.</div></div>
</div>
<div class="foot">품목·단가: 판매실적 학습 · 재고·창고: 창고LOT재고(20260724) · 유통기한·출고관리: 소비기한 임박현황(2026.07.23)<br>매일 아침 <b>창고별 LOT재고조회</b> 파일을 업로드하면 재고가 갱신됩니다</div>
</div>

    const stock=(p.stock===null||p.stock===undefined)?'<span class="badge b-none">미등록</span>'
      :won(p.stock)+' <span class="unit">'+p.unit+'</span> '+stBadge(st)+expB;
    return '<tr onclick="select(\''+p.code+'\')" class="'+(selected===p.code?'sel':'')+'">'+
      '<td><b>'+p.code+'</b></td>'+
      '<td>'+p.name+mgB+'<br><span class="meta">'+(p.spec||'')+'</span></td>'+
      '<td><span class="meta">'+(p.cat||'')+'</span></td>'+
      '<td class="num">'+stock+'</td>'+
      '<td class="num">'+(p.price?'₩'+won(p.price)+'<br><span class="unit">/'+p.unit+'</span>':'-')+'</td>'+
      '<td class="num">'+won(p.qty)+' <span class="unit">'+p.unit+'</span></td></tr>';}).join('');
}
function select(code){selected=code;render();
  const p=products.find(x=>x.code===code);const cps=custPrices[code]||[];const st=statusOf(p);
  const stTxt=st==="bad"?'<span class="badge b-bad">재고소진·발주검토</span>':st==="ok"?'<span class="badge b-ok">재고보유</span>':'<span class="badge b-none">재고 미등록</span>';
  const d=expDays(p);const expTxt=expNear(p)?' <span class="badge b-exp">유통기한 '+d+'일</span>':'';
  const mgTxt=p.mgmt?' <span class="badge b-mgmt">출고관리 품목</span>':'';
  const cr=cps.length?cps.map(c=>{const diff=p.price?((c.p-p.price)/p.price*100).toFixed(1):'0';
    return '<tr><td>'+c.c+'</td><td class="num">₩'+won(c.p)+'</td><td class="num" style="color:'+(c.p<p.price?'var(--bad)':'var(--ok)')+'">'+diff+'%</td><td class="meta">'+(c.d||'')+'</td></tr>';}).join('')
    :'<tr><td colspan="4" class="meta">거래처별 단가 이력 없음</td></tr>';
  const wr=(p.wh&&p.wh.length)?p.wh.map(w=>'<tr><td>'+w[0]+'</td><td class="num">'+won(w[1])+' '+p.unit+'</td></tr>').join('')
    :'<tr><td colspan="2" class="meta">창고 재고 없음</td></tr>';
  let mgHtml='';
  if(p.mgmt){const m=p.mgmt;
    mgHtml='<div class="sec-title">🟣 출고관리 · 유통기한</div><div class="mgmt-box">'+
      '<div class="row"><span class="k">소비기한</span><span class="v">'+(m.exp||'-')+'</span></div>'+
      '<div class="row"><span class="k">잔여일수</span><span class="v" style="color:'+(m.left!=null&&m.left<=30?'var(--bad)':'var(--purple)')+'">'+(m.left!=null?m.left+'일':'-')+'</span></div>'+
      '<div class="row"><span class="k">담당자</span><span class="v">'+(m.owner||'-')+'</span></div>'+
      '<div class="row"><span class="k">주요 거래처</span><span class="v">'+(m.cust||'-')+'</span></div>'+
      '<div class="row"><span class="k">최종 출고일</span><span class="v">'+(m.lastship||'-')+'</span></div>'+
      '<div class="plan"><b>소진방안</b><br>'+(m.plan||'-')+'</div></div>';
  }
  const lotLine=(p.exp)?'<div class="row"><span class="k">LOT 수 / 최근 유효일자</span><span class="v">'+(p.lots||0)+'개 / '+p.exp+'</span></div>':'';
  const _hist=histFor(code);
  let deltaRow='';
  if(_hist.length>=2){const a=_hist[_hist.length-2].s,b=_hist[_hist.length-1].s;
    if(a!=null&&b!=null){const dv=b-a;
      deltaRow='<div class="row"><span class="k">전일 대비</span><span class="v" style="color:'+(dv>0?'var(--ok)':dv<0?'var(--bad)':'var(--muted)')+'">'+(dv>0?'▲'+won(dv):dv<0?'▼'+won(-dv):'변동없음')+' '+p.unit+'</span></div>';}}
  let histHtml='';
  if(_hist.length){const rowsH=_hist.slice().reverse().map((x,i,arr)=>{
      const nx=arr[i+1];const prev=nx?nx.s:null;
      const delta=(prev!=null&&x.s!=null)?x.s-prev:null;
      const dtxt=delta==null?'-':(delta>0?'<span style="color:var(--ok)">▲'+won(delta)+'</span>':delta<0?'<span style="color:var(--bad)">▼'+won(-delta)+'</span>':'0');
      return '<tr><td>'+x.d+'</td><td class="num">'+(x.s!=null?won(x.s)+' '+p.unit:'-')+'</td><td class="num">'+dtxt+'</td></tr>';}).join('');
    histHtml='<div class="sec-title">재고 추이 (최근 '+_hist.length+'일)</div><table class="wh-table"><thead><tr><th>일자</th><th class="num">재고</th><th class="num">전일比</th></tr></thead><tbody>'+rowsH+'</tbody></table>';}
  document.getElementById('detail').innerHTML=
    '<div class="hd"><div class="nm">'+p.name+'</div>'+
    '<div class="sub">'+p.code+' · '+(p.spec||'')+' · 단위 '+p.unit+' · '+(p.cat||'')+'</div>'+
    '<div style="margin-top:7px">'+stTxt+expTxt+mgTxt+'</div></div>'+
    '<div class="bd">'+
    '<div class="row"><span class="k">현재고 (합계)</span><span class="v">'+((p.stock!=null)?won(p.stock)+' '+p.unit:'미등록')+'</span></div>'+
    lotLine+deltaRow+
    (p.price?'<div class="row"><span class="k">판매단가(최근)</span><span class="v">₩'+won(p.price)+' /'+p.unit+'</span></div>':'')+
    '<div class="row"><span class="k">누적 판매수량</span><span class="v">'+won(p.qty)+' '+p.unit+'</span></div>'+
    '<div class="row"><span class="k">누적 판매금액</span><span class="v">₩'+won(p.amt)+'</span></div>'+
    '<div class="row"><span class="k">현재 재고금액(단가환산)</span><span class="v">'+((p.stock!=null&&p.price)?'₩'+won(p.stock*p.price):'-')+'</span></div>'+
    mgHtml+histHtml+
    '<div class="sec-title">창고별 재고</div>'+
    '<table class="wh-table"><thead><tr><th>창고</th><th class="num">수량</th></tr></thead><tbody>'+wr+'</tbody></table>'+
    '<div class="sec-title">거래처별 적용단가 ('+cps.length+'곳)</div>'+
    '<table class="cust-table"><thead><tr><th>거래처</th><th class="num">단가</th><th class="num">기준比</th><th>최근일</th></tr></thead><tbody>'+cr+'</tbody></table>'+
    '<div class="sec-title">견적 계산기</div>'+
    '<div class="price-calc"><label>수량 ('+p.unit+')</label><input type="text" id="qty" value="1" oninput="calc(\''+code+'\')" style="width:110px">'+
    '<label>적용단가</label><input type="text" id="ap" value="'+(p.price||0)+'" oninput="calc(\''+code+'\')" style="width:140px">'+
    '<div class="out" id="calcOut">합계 ₩'+won(p.price||0)+'</div></div></div>';
}
function calc(code){const q=parseFloat(document.getElementById('qty').value)||0;
  const ap=parseFloat(document.getElementById('ap').value)||0;
  document.getElementById('calcOut').innerHTML='합계 ₩'+won(q*ap);}
function onXl(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1});
    let hr=aoa.findIndex(r=>r&&r.includes('품번'));if(hr<0){alert('헤더에서 품번을 찾지 못했습니다.');return;}
    const h=aoa[hr];const ic=h.indexOf('품번'),it=h.indexOf('합계'),ie=h.indexOf('유효일자');
    if(ic<0||it<0){alert('품번/합계 열을 찾지 못했습니다.');return;}
    const agg={};
    for(let i=hr+1;i<aoa.length;i++){const r=aoa[i];if(!r||!r[ic]||r[0]==='TOTAL')continue;
      const c=String(r[ic]).trim();const t=+r[it]||0;const a=agg[c]||(agg[c]={stock:0,exp:null,lots:0});
      a.stock+=t;a.lots++;let ed=r[ie];if(ed){ed=String(ed).slice(0,10);if(!a.exp||ed<a.exp)a.exp=ed;}}
    const T=new Date();let up=0;
    products.forEach(p=>{const a=agg[p.code];if(a){p.stock=Math.round(a.stock*10)/10;p.exp=a.exp;p.lots=a.lots;
      p.dexp=a.exp?Math.round((new Date(a.exp)-T)/86400000):null;up++;}});
    saveSnap(T);setDate(T);kpis();render();if(selected)select(selected);
    alert('재고 갱신 완료: '+up+'개 품목 반영');
  }catch(err){alert('파일 처리 오류: '+err.message);}};
  r.readAsArrayBuffer(f);}
function setDate(d){document.getElementById('updated').textContent='재고 기준: '+d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' 갱신';}
document.querySelectorAll('th[data-s]').forEach(th=>{th.onclick=()=>{const k=th.dataset.s;
  if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();};});
document.getElementById('search').addEventListener('input',render);
document.getElementById('updated').textContent='재고 기준: 2026.7.27 (창고LOT) · 유통기한: 2026.7.23 임박현황';
fillCats();kpis();render();
</script></body></html>
